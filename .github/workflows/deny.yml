name: Dependency review

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "deny.toml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: deny-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
