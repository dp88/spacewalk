name: Release

# Publishing is driven by the tag, not by a merge. The tag is the deliberate act, and a release
# should never be something a merge can cause by accident.
#
# Lightweight and annotated tags both fire this. Prefer annotated: its message is what the GitHub
# release gets written from.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# Never cancel a release part-way. A cancelled publish is not a no-op.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Nothing requires a tag to sit on master, so this may be the only CI the tagged commit ever
  # sees. It does not repeat the OS matrix, but it does re-check every guarantee the README makes
  # — `no_std` and the MSRV — plus the things that are only wrong at release time: a tag that
  # disagrees with the manifest, a changelog with no entry for it, and an archive that does not
  # build once packed.
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2

      - name: The tag agrees with Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} says ${tag}, Cargo.toml says ${manifest}"
            exit 1
          fi
          echo "releasing ${manifest}"

      # An em dash, as `CHANGELOG.md` writes its version headings. A release whose notes are still
      # sat under `Unreleased` is a release nobody can read.
      - name: The changelog has an entry for it
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## ${tag} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${tag} — YYYY-MM-DD' heading"
            exit 1
          fi

      - run: cargo fmt --all --check
      - run: cargo clippy --all-features --all-targets
      - run: cargo test --all-features --all-targets
      - run: cargo test --all-features --doc
      # `robust`'s bugs hide behind debug's overflow checks, and the board tag is a `debug_assert`.
      - run: cargo test --release --all-features --all-targets

      # The crate advertises `#![no_std]`. Shipping a version that does not build bare metal would
      # break a promise the README makes on the front page.
      - run: cargo build --target thumbv7em-none-eabihf
      - run: cargo build --target thumbv7em-none-eabihf --features serde

      # The one check CI does not already make: this builds from the packed archive, so it catches
      # a file that `exclude` dropped and the crate turns out to need.
      - run: cargo publish --dry-run

  # The other advertised guarantee. `rust-version` in Cargo.toml is a promise to users, so it is
  # tested against the exact toolchain it names.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --all-targets

  # Trusted publishing: GitHub mints an OIDC token, crates.io exchanges it for one good for about
  # thirty minutes, and the action revokes it when the job ends. No long-lived registry token is
  # stored anywhere, which is what the house style asks for.
  publish:
    name: Publish to crates.io
    needs: [verify, msrv]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # required to request the OIDC token; without it the exchange fails
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
