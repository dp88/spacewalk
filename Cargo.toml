[package]
name = "spacewalk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["David Palmer"]
description = "A generic basis for square grids, hex grids, and arbitrary grids, with pathfinding"
repository = "https://github.com/dp88/spacewalk"
license = "MIT OR Apache-2.0"
keywords = ["grid", "hex", "pathfinding", "tactics", "gamedev"]
categories = ["game-development", "data-structures"]
readme = "README.md"
exclude = [".github/"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
# The implementation behind `std`'s `HashMap`, minus `std`. `default-hasher` is foldhash rather than
# SipHash: the keys here are grid coordinates, so there is no adversary choosing them, and dropping
# the hardening makes a board 2.4x faster to build than it was on `std`'s own map.
hashbrown = { version = "0.16", default-features = false, features = [
  "default-hasher",
] }
# `default-features = false` is what keeps the crate off `std`; `alloc` is not optional, because
# `CellMap<T>` serializes as a `Vec<T>`.
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
], optional = true }

# For the serde round-trip tests only. serde alone has no format; JSON is the obvious one.
[dev-dependencies]
serde_json = "1"
